name: Quality gate

# Release exclusively owns the tag-push gate; this workflow serves pull requests
# and manual dispatch. The change-scope classifier and the trusted PR-smoke
# coordinator are intentionally absent from this fork: every run performs the
# full quality gate rather than deciding per-path whether to skip it.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Test Go sources
        shell: bash
        run: go test ./... -count=1
      - name: Test Go sources with the race detector
        shell: bash
        run: go test -race ./... -count=1
      - name: Vet Go sources
        shell: bash
        run: go vet ./...
      - name: Build the local binary
        shell: bash
        run: sh scripts/build.sh
      - name: Test release packaging
        shell: bash
        run: sh scripts/test-package-release.sh
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf '%s\n' "$unformatted"
            exit 1
          }
      - name: Explain quality failure contract
        if: ${{ failure() }}
        shell: bash
        run: echo '::error::Required quality checks did not complete successfully.'
