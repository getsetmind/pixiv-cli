name: Platform smoke workers

# This workflow is both the PR smoke worker and the explicit maintainer native
# evidence entry point. A PR-gate dispatch runs only the smoke stage; a manual
# dispatch with evidence=true runs only the native evidence stage on the default
# branch. The two stages never mix; see the per-job if conditions.
on:
  workflow_dispatch:
    inputs:
      evidence:
        description: Also run the native evidence stage (default branch only)
        required: false
        default: false
        type: boolean
      pr_number:
        description: Pull request number for this worker run
        required: false
        default: ''
        type: string
      head_sha:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string
      check_run_id:
        description: PR gate check run to complete
        required: false
        default: ''
        type: string

concurrency:
  group: platform-smoke-worker-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Resolve platform workers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      evidence_matrix: ${{ steps.evidence_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve native platform matrix
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability smoke --github-output "$GITHUB_OUTPUT"
      - name: Resolve the native evidence matrix
        id: evidence_matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability native-evidence --github-output "$GITHUB_OUTPUT"

  worker:
    needs: setup
    # The PR smoke worker and the evidence stage each own a whole run: a manual
    # evidence dispatch carries no PR input, so this job must skip explicitly
    # instead of repeating the six-platform smoke as if it were evidence.
    if: ${{ !inputs.evidence }}
    name: Native platform - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the requested source
        if: ${{ inputs.head_sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Require the declared native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Test the platform installer
        shell: bash
        run: go test ./scripts/tests/installers -count=1
      - name: Test platform OAuth callback integration
        shell: bash
        run: go test ./internal/cli/commands/pixiv/auth/loginhelper -count=1
      - name: Test Windows login handler wiring
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: go test ./internal/cli -run '^(TestAuthURLCallback|TestAuthURLHandlerInstall|TestNormalCLIInvocationEnsuresPersistentHandlerWithoutBlockingCommand)$' -count=1
      - name: Build and package the platform binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          archive=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version "$version" \
            --output-dir dist \
            --package)
          printf 'PLATFORM_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Run native GIF/APNG smoke
        shell: bash
        run: |
          set +e
          native_smoke_log="$RUNNER_TEMP/native-ugoira-smoke.log"
          go test ./internal/media/ugoira -run '^TestRustUgoiraEncoderNativeGIFAndAPNG$' -count=1 >"$native_smoke_log" 2>&1
          status=$?
          cat "$native_smoke_log"
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 "$native_smoke_log" | tr '\r\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Native GIF/APNG smoke::%s\n' "$message"
            exit "$status"
          fi
      - name: Extract and smoke the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          mkdir -p smoke
          binary='smoke/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$PLATFORM_ARCHIVE" -osmoke
            binary='smoke/pixiv.exe'
          else
            tar -xzf "$PLATFORM_ARCHIVE" -C smoke
          fi
          test -f "$binary"
          PIXIV_E2E_BINARY="$(pwd)/$binary" \
          PIXIV_E2E_EXPECTED_VERSION="v${version}" \
          go test ./e2e -run '^TestPixivBinaryPackagedSmoke$' -count=1

  native_evidence:
    needs: setup
    if: ${{ inputs.evidence }}
    name: Native evidence ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.evidence_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Require audited main ref
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Build and package the versioned native binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.0-native-evidence.${GITHUB_RUN_ID}"
          mkdir -p evidence
          archive=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version "$version" \
            --output-dir evidence \
            --package)
          binary='evidence/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='evidence/pixiv.exe'
          fi
          "$binary" --version
          {
            printf 'EVIDENCE_VERSION=%s\n' "$version"
            printf 'EVIDENCE_BINARY=%s\n' "$binary"
            printf 'EVIDENCE_ARCHIVE=%s\n' "$archive"
          } >> "$GITHUB_ENV"
      - name: Run native GIF/APNG smoke
        shell: bash
        run: |
          set -euo pipefail
          CC='${{ matrix.cc }}' go test ./internal/media/ugoira -run '^TestRustUgoiraEncoderNativeGIFAndAPNG$' -count=1
      - name: Record staticlib, binary and archive evidence
        shell: bash
        run: |
          set -euo pipefail
          staticlib='libugoira_rs.a'
          if [ '${{ matrix.goos }}' = windows ]; then
            staticlib='ugoira_rs.lib'
          fi
          cp "internal/media/ugoira/rust/staticlib/${{ matrix.rust_target }}/$staticlib" "evidence/$staticlib"
          go run ./scripts/cmd/nativeevidence record \
            --repo-root . \
            --version "$EVIDENCE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --staticlib "evidence/$staticlib" \
            --binary "$EVIDENCE_BINARY" \
            --archive "$EVIDENCE_ARCHIVE" \
            --output evidence/native-evidence.json
      - name: Upload native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-evidence-${{ matrix.artifact }}
          path: evidence
          if-no-files-found: error

  publish:
    if: ${{ always() && inputs.check_run_id != '' }}
    needs: [setup, worker]
    name: Publish platform smoke result
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
    steps:
      - name: Publish aggregate platform smoke status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}
          SETUP_RESULT: ${{ needs.setup.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Platform smoke failed on one or more required platforms.'
          failures=
          if [ "$SETUP_RESULT" != success ]; then
            description='Platform configuration could not be resolved.'
          elif [ "$WORKER_RESULT" = success ]; then
            state=success
            description='All required native platforms passed.'
          else
            failures=$(gh api --method GET "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
              -f filter=all \
              -f per_page=100 \
              --jq '.jobs[] | select(.name | startswith("Native platform - ")) | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion // .status))"')
            if [ -n "$failures" ]; then
              message=$(printf '%s\n' "$failures" | paste -sd ';' -)
              description="Platform smoke failed: $message"
            fi
          fi
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -f status=completed \
            -f conclusion="$state" \
            -f details_url="$run_url" \
            -f 'output[title]=Platform smoke worker' \
            -f "output[summary]=$description" >/dev/null
          if [ "$state" = success ]; then
            printf '%s\n' '### Platform smoke' '' "$description" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Platform smoke failed::$description"
            {
              printf '%s\n' '### Platform smoke failed' ''
              if [ -n "$failures" ]; then
                printf '%s\n' "$failures" | sed 's/^/- /'
              else
                printf '%s\n' "- $description"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
