name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# Version, checkout, Release, Formula and Container all bind to the immutable tag
# that triggered this workflow.
env:
  RELEASE_TAG: ${{ github.ref_name }}

# Every job declares the minimal token permissions it needs.
permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify the exact immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH"
          go run ./scripts/cmd/releaseassets validate --version "${RELEASE_TAG#v}"
          set +e
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          api_status=$?
          set -e
          if [ "$api_status" -eq 0 ]; then
            printf '%s\n' 'a Release already exists for the requested tag' >&2
            exit 1
          fi
          printf '%s\n' "$response" | grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404'
      - name: Check release behavior contracts
        shell: bash
        run: go test ./tools/release ./tools/platformmatrix -count=1

  e2e:
    name: SDK E2E contract gate
    needs:
      - validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Run offline SDK E2E contract tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PIXIV_SDK_E2E:-}"
          test -z "${FANBOX_SDK_E2E:-}"
          go test ./e2e -count=1 -v

  resolve_platforms:
    name: Resolve release platform matrices
    needs:
      - validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.matrix }}
      container: ${{ steps.container.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Resolve release platforms
        id: release
        shell: bash
        run: go run ./tools/platformmatrix --capability release --github-output "$GITHUB_OUTPUT"
      - name: Resolve container platforms
        id: container
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - validate
      - e2e
      - resolve_platforms
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
      # Git for Windows converts the immutable tag's Go sources to CRLF per the
      # runner default; the quality gate must inspect the Git blob's LF bytes so
      # gofmt does not report that checkout conversion as a formatting error.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.release) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      # The quality gate reads the workflow, version, CHANGELOG and release notes
      # from the immutable tag.
      - name: Validate the exact immutable release source
        shell: bash
        run: go run ./scripts/cmd/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --component 'clippy,rustfmt' --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Check Rust formatting from vendored sources
        shell: bash
        working-directory: internal/media/ugoira/rust
        run: cargo fmt --check
      - name: Lint vendored Rust sources
        shell: bash
        working-directory: internal/media/ugoira/rust
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Test Go sources
        shell: bash
        run: go test ./...
      - name: Test Go sources with the race detector
        # All six platforms actually execute the gate. The toolchain currently
        # declared in go.mod does not support -race on windows/arm64, so that target
        # must match Go's official "not supported" diagnostic exactly; the other
        # five platforms run the real race tests.
        shell: bash
        run: sh scripts/test-race-gate.sh
      - name: Vet Go sources
        shell: bash
        run: go vet ./...
      - name: Audit bundled licenses
        shell: bash
        run: go run ./scripts/cmd/licensebundle --check
      - name: Test release packages
        shell: bash
        run: sh scripts/test-package-release.sh
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf '%s\n' "$unformatted"
            exit 1
          }

  # Production assets are rebuilt on a separate runner from the immutable tag so
  # side effects of the test processes cannot affect the Release.
  build_production:
    name: Build production ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - build
      - resolve_platforms
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.release) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate the exact immutable production source
        shell: bash
        run: go run ./scripts/cmd/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Build the exact production archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          archive=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version "${RELEASE_TAG#v}" \
            --output-dir "$RUNNER_TEMP/platform-build" \
            --package)
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          mkdir -p dist
          destination="dist/$(basename "$archive")"
          cp "$archive" "$destination"
          printf 'PLATFORM_ARCHIVE=%s\n' "$destination" >> "$GITHUB_ENV"
      - name: Smoke the exact production package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          binary='smoke/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$PLATFORM_ARCHIVE" -osmoke
            binary='smoke/pixiv.exe'
          else
            tar -xzf "$PLATFORM_ARCHIVE" -C smoke
          fi
          test -f "$binary"
          test "$("$binary" --version)" = "pixiv $RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-${{ matrix.artifact }}
          path: dist/pixiv-cli_*
          if-no-files-found: error
          retention-days: 1

  # Containers share the same quality gate as production assets and build in
  # parallel on native runners afterwards. The image itself gets no registry write
  # permission; it only produces a locally verified OCI artifact.
  build_container:
    name: Build container ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - build
      - resolve_platforms
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.container) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Validate the immutable container source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          go run ./scripts/cmd/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Build and verify the versioned Linux executable
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          binary=$(RUSTUP_TOOLCHAIN='${{ matrix.rust_toolchain }}' sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version "${RELEASE_TAG#v}" \
            --output-dir "$RUNNER_TEMP/platform-build")
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          mkdir -p dist
          cp "$binary" dist/pixiv
      - name: Check the container packaging contract
        shell: bash
        run: go test ./scripts/tests/containerrelease -count=1
      - name: Build the verified container image
        shell: bash
        run: |
          docker build \
            --build-arg REVISION="$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --build-arg VERSION="${RELEASE_TAG}" \
            --platform 'linux/${{ matrix.goarch }}' \
            --tag "pixiv-cli:${RELEASE_TAG}-${{ matrix.artifact }}" .
      # Includes the embedded license-notices bundle in every architecture check.
      - name: Verify image provenance and runtime contract
        shell: bash
        env:
          IMAGE: pixiv-cli:${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" != 0
          version=$(docker run --rm "$IMAGE" --version)
          test "$version" = "pixiv ${RELEASE_TAG}"
          docker run --rm "$IMAGE" config path | grep -F '/home/pixiv/.pixiv-cli/'
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c pwd)" = /work
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -s /usr/share/doc/pixiv-cli/LICENSE &&
            test -s /usr/share/doc/pixiv-cli/THIRD_PARTY_LICENSES.md &&
            find /usr/share/doc/pixiv-cli/third_party/licenses -type f | grep -q .
          '
          inspect_label() {
            docker image inspect --format '{{ index .Config.Labels "'"$1"'" }}' "$IMAGE"
          }
          test "$(inspect_label org.opencontainers.image.revision)" = "$(git rev-parse HEAD)"
          test "$(inspect_label org.opencontainers.image.version)" = "${RELEASE_TAG}"
          test "$(inspect_label org.opencontainers.image.source)" = "https://github.com/FlanChanXwO/pixiv-cli"
          test "$(inspect_label org.opencontainers.image.licenses)" = "MIT"
      - name: Export the verified image artifact
        shell: bash
        run: docker save --output "${RUNNER_TEMP}/pixiv-cli-${{ matrix.artifact }}.tar" "pixiv-cli:${RELEASE_TAG}-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-container-${{ matrix.artifact }}
          path: ${{ runner.temp }}/pixiv-cli-${{ matrix.artifact }}.tar
          if-no-files-found: error
          # The recovery input for publish_container must not vanish after one day;
          # 90 days covers the registry repair window.
          retention-days: 90

  # Before entering the protected publish job, cross-check the release provenance
  # against the immutable notes in the tag, the GitHub PR links, and the actual
  # commit range.
  release_notes_audit:
    name: Audit release notes provenance
    needs: build_production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Audit release sources and validate the bilingual tag notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag=$(git tag --merged "$RELEASE_TAG^" --sort=-version:refname | head -n 1)
          test -n "$previous_tag"
          audit_report="$RUNNER_TEMP/release-notes-audit.json"
          go run ./scripts/cmd/releasenotes audit \
            --repo "$GITHUB_REPOSITORY" \
            --from "$previous_tag" \
            --to "$RELEASE_TAG" \
            --output "$audit_report"
          go run ./scripts/cmd/releasenotes validate \
            --version "${RELEASE_TAG#v}" \
            --dir "changelog/$RELEASE_TAG" \
            --previous "$previous_tag" \
            --audit "$audit_report"

  # Verify that the commit the tag points at belongs to the default branch in a job
  # that declares no environment, so the protected release Environment's secrets do
  # not enter the same job lifecycle before the ancestry shell gate.
  verify_release_source:
    name: Verify release source trust
    needs:
      - build_production
      - release_notes_audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.trust.outputs.commit }}
      version: ${{ steps.trust.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Require the tag commit on the default release branch
        id: trust
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"

  prepare_release:
    name: Prepare release materials
    needs:
      - validate
      - verify_release_source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-container-*
          path: containers
          merge-multiple: true
      - name: Verify the registry-defined release archive set
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          go run ./tools/release verify-artifact-set --dir dist --version "$version"
          go run ./tools/release verify-container-set --dir containers
          go run ./tools/release checksums --dir dist --version "$version" --output dist/checksums.txt
          test -s dist/checksums.txt

      # §14/§15: freeze the identity and checksums of the build-once artifacts in a
      # single step. Every downstream publisher consumes only this immutable
      # handoff and no longer builds or infers identity on its own.
      - name: Write the immutable release handoff
        shell: bash
        env:
          TAG_COMMIT: ${{ needs.verify_release_source.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release
          go run ./tools/release write-handoff \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow 'Release' \
            --tag "$RELEASE_TAG" \
            --commit-sha "$TAG_COMMIT" \
            --run-head-sha "$RUN_HEAD_SHA" \
            --version "$version" \
            --dist-dir dist \
            --container-dir containers \
            --output release/release-handoff.json
          go run ./tools/release verify-handoff-set \
            --handoff release/release-handoff.json \
            --dist-dir dist \
            --container-dir containers \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --tag "$RELEASE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-release-checksums
          path: |
            dist/checksums.txt
            release/release-handoff.json
          if-no-files-found: error
          retention-days: 90

  approve_release:
    name: Approve final release publication
    needs:
      - build_container
      - verify_release_source
      - prepare_release
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions: {}
    steps:
      - name: Record final release approval
        shell: bash
        run: 'true'

  publish:
    name: Sign and publish the GitHub Release
    needs:
      - build_container
      - verify_release_source
      - prepare_release
      - approve_release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-release-checksums
          path: prepared-release
      - name: Re-verify the approved archive set
        shell: bash
        run: go run ./tools/release verify-artifact-set --dir dist --version "${RELEASE_TAG#v}"
      - name: Create the signed release metadata
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/pixiv-release-ed25519.pem"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$RELEASE_SIGNING_KEY_ID"
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_path"
          go run ./scripts/cmd/releaseassets finalize \
            --version "${RELEASE_TAG#v}" \
            --input-dir dist \
            --output-dir release \
            --install-sh scripts/install.sh \
            --install-cmd scripts/install.cmd \
            --release-sources internal/update/source/release_sources.txt \
            --key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key "$key_path" \
            --changelog "changelog/v${RELEASE_TAG#v}/en.md" \
            --changelog-zh "changelog/v${RELEASE_TAG#v}/zh-CN.md"
          while read -r expected_hash expected_name; do
            grep -Fx "$expected_hash  $expected_name" release/checksums.txt >/dev/null
          done < prepared-release/dist/checksums.txt
      - name: Publish only the verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prerelease=()
          case "$(go run ./scripts/cmd/releaseassets channel --version "${RELEASE_TAG#v}")" in
            stable)
              ;;
            prerelease)
              prerelease+=(--prerelease)
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release/release-notes.md \
            "${prerelease[@]}" \
            release/pixiv-cli_*.tar.gz \
            release/pixiv-cli_*.zip \
            release/install.sh \
            release/install.cmd \
            release/checksums.txt \
            release/checksums.json
          expected=$(find release -maxdepth 1 -type f ! -name release-notes.md -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            printf '%s\n' 'draft release assets differ from the verified local set' >&2
            printf '%s\n' "expected:$expected" >&2
            printf '%s\n' "actual:$actual" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      # This artifact and the published Release use the same local checksums.txt;
      # downstream must not re-download or recompute it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-checksums
          path: release/checksums.txt
          if-no-files-found: error
          retention-days: 1
