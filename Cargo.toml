[workspace]
resolver = "3"
members = ["crates/pixiv-sdk", "crates/pixiv-cli", "crates/pixiv-record", "crates/pixiv-mcp", "crates/pixiv-app"]
exclude = ["internal/media/ugoira/rust", "third_party/rust/quantette-0.6.0", "third_party/rust/fanbox/btls-0.5.6", "third_party/rust/fanbox/btls-sys-0.5.6", "third_party/rust/fanbox/http2-0.5.20", "third_party/rust/fanbox/wreq-6.0.0-rc.31", "third_party/rust/fanbox/wreq-proto-0.2.5", "third_party/rust/ordinary/reqwest-0.13.5", "third_party/rust/ordinary/hyper-util-0.1.21"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["getsetmind"]
repository = "https://github.com/getsetmind/pixiv-cli-rs"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "gzip", "socks", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[patch.crates-io]
arbitrary = { path = "internal/media/ugoira/rust/vendor/arbitrary" }
bitvec = { path = "internal/media/ugoira/rust/vendor/bitvec" }
by_address = { path = "internal/media/ugoira/rust/vendor/by_address" }
byteorder-lite = { path = "internal/media/ugoira/rust/vendor/byteorder-lite" }
color_quant = { path = "internal/media/ugoira/rust/vendor/color_quant" }
crossbeam-deque = { path = "internal/media/ugoira/rust/vendor/crossbeam-deque" }
crossbeam-epoch = { path = "internal/media/ugoira/rust/vendor/crossbeam-epoch" }
crossbeam-utils = { path = "internal/media/ugoira/rust/vendor/crossbeam-utils" }
derive_arbitrary = { path = "internal/media/ugoira/rust/vendor/derive_arbitrary" }
either = { path = "internal/media/ugoira/rust/vendor/either" }
fast-srgb8 = { path = "internal/media/ugoira/rust/vendor/fast-srgb8" }
fdeflate = { path = "internal/media/ugoira/rust/vendor/fdeflate" }
gif = { path = "internal/media/ugoira/rust/vendor/gif" }
image = { path = "internal/media/ugoira/rust/vendor/image" }
miniz_oxide = { path = "internal/media/ugoira/rust/vendor/miniz_oxide" }
moxcms = { path = "internal/media/ugoira/rust/vendor/moxcms" }
ordered-float = { path = "internal/media/ugoira/rust/vendor/ordered-float" }
palette = { path = "internal/media/ugoira/rust/vendor/palette" }
palette_derive = { path = "internal/media/ugoira/rust/vendor/palette_derive" }
png = { path = "internal/media/ugoira/rust/vendor/png" }
pxfm = { path = "internal/media/ugoira/rust/vendor/pxfm" }
rand_xoshiro = { path = "internal/media/ugoira/rust/vendor/rand_xoshiro" }
rayon = { path = "internal/media/ugoira/rust/vendor/rayon" }
ref-cast = { path = "internal/media/ugoira/rust/vendor/ref-cast" }
ref-cast-impl = { path = "internal/media/ugoira/rust/vendor/ref-cast-impl" }
safe_arch = { path = "internal/media/ugoira/rust/vendor/safe_arch" }
weezl = { path = "internal/media/ugoira/rust/vendor/weezl" }
wide = { path = "internal/media/ugoira/rust/vendor/wide" }
zip = { path = "internal/media/ugoira/rust/vendor/zip" }
zopfli = { path = "internal/media/ugoira/rust/vendor/zopfli" }
zune-core = { path = "internal/media/ugoira/rust/vendor/zune-core" }
zune-jpeg = { path = "internal/media/ugoira/rust/vendor/zune-jpeg" }

btls = { path = "third_party/rust/fanbox/btls-0.5.6" }
btls-sys = { path = "third_party/rust/fanbox/btls-sys-0.5.6" }
http2 = { path = "third_party/rust/fanbox/http2-0.5.20" }
wreq = { path = "third_party/rust/fanbox/wreq-6.0.0-rc.31" }
wreq-proto = { path = "third_party/rust/fanbox/wreq-proto-0.2.5" }

reqwest = { path = "third_party/rust/ordinary/reqwest-0.13.5" }
hyper-util = { path = "third_party/rust/ordinary/hyper-util-0.1.21" }
