[package]
name = "pixiv-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
pixiv-sdk = { path = "../pixiv-sdk" }
ugoira_rs = { path = "../../internal/media/ugoira/rust" }
chrono.workspace = true
sha2.workspace = true
getrandom.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = "=0.9.8"
toml_edit = "=0.25.5"
url.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures-util.workspace = true
base64.workspace = true
rustls.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }
subtle = "=2.6.1"
unicode-general-category = "=1.1.0"
bytes = "=1.12.1"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
