[package]
name = "pixiv-cli-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust CLI derived from pixiv-cli"
publish = false

[[bin]]
name = "pixiv"
path = "src/main.rs"

[dependencies]
reqwest.workspace = true
serde.workspace = true
getrandom.workspace = true
chrono.workspace = true
pixiv-app = { path = "../pixiv-app" }
clap.workspace = true
scraper = { version = "0.27", default-features = false }
unicode-general-category = "1.1"
unicode-width = "0.2.2"
pixiv-sdk = { path = "../pixiv-sdk" }
pixiv-record = { path = "../pixiv-record" }
pixiv-mcp = { path = "../pixiv-mcp" }
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
sha2.workspace = true
url.workspace = true
serde.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
